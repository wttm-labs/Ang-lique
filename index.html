<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151A20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Angélique">
<link rel="manifest" href="manifest.json">

<title>Angélique</title>
<style>
:root{--bg:#EDEFF3;--karte:#FFF;--tinte:#111418;--grau:#6B7280;--linie:#E3E6EB;
  --gruen:#0E9F6E;--rot:#E0473E;--warn:#D9962E;--dunkel:#151A20;--auf-tinte:#fff;--navbg:rgba(255,255,255,.95)}
:root[data-theme="dark"]{--bg:#12151A;--karte:#1B212A;--tinte:#EDEFF3;--grau:#8A93A3;
  --linie:rgba(255,255,255,.09);--warn:#E5A947;--dunkel:#232B36;--auf-tinte:#12151A;--navbg:rgba(18,21,26,.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tinte);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 14px 96px}
.kopf{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 14px}
.marke-zeile{display:flex;align-items:center;gap:8px}
.marke{font-size:15px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.datum{font-size:12px;color:var(--grau);margin-top:2px}
.badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--grau);
  border:1px solid var(--linie);background:var(--karte);padding:5px 9px;border-radius:20px;flex:none}
.iconbtn{background:none;border:none;color:var(--grau);font-size:13px;cursor:pointer;
  font-family:inherit;padding:2px;line-height:1;display:flex;align-items:center;justify-content:center}
.iconbtn:active{color:var(--tinte)}
.karte{background:var(--karte);border-radius:16px;padding:18px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(16,20,26,.05)}
.dunkel{background:var(--dunkel);color:#fff}
h2{font-size:15px;font-weight:650;margin:0 0 12px}
.text{font-size:13.5px;line-height:1.65;color:var(--grau);margin:0 0 16px}
.wert{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;white-space:nowrap}
.bald{background:#FFF8E6;border:1px solid #F0DFAE;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.bald-lab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8A6D1F;margin-bottom:9px;font-weight:700}
.bald-z{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;color:#4A3B12}
.bald-t{color:#8A6D1F;font-weight:400;font-size:11.5px;margin-left:6px}
.hero{background:var(--dunkel);border-radius:18px;padding:18px;margin-bottom:12px;color:#fff}
.topf{padding:6px 0}
.hero .topf+.topf{border-top:1px solid rgba(255,255,255,.13);margin-top:16px;padding-top:16px}
.karte .topf+.topf{border-top:1px solid var(--linie);margin-top:16px;padding-top:16px}
.topf-kopf{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.topf-lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.topf-zyk{font-size:11px;opacity:.5;font-variant-numeric:tabular-nums}
.topf-zahl{font-size:40px;font-weight:600;letter-spacing:-.035em;line-height:1;
  font-variant-numeric:tabular-nums;margin-bottom:12px}
.topf-eur{font-size:13px;font-weight:500;letter-spacing:0;opacity:.55;margin-left:8px}
.topf-fuss{font-size:11.5px;opacity:.55;margin-top:8px;font-variant-numeric:tabular-nums}
.karte .topf-lab,.karte .topf-fuss,.karte .topf-zyk{color:var(--grau);opacity:1}
.spur{position:relative;height:7px;background:var(--linie);border-radius:4px;margin-top:16px}
.hero .spur{background:rgba(255,255,255,.16)}
.fuell{height:100%;border-radius:4px;transition:width .3s}
.soll{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--grau)}
.hero .soll{background:rgba(255,255,255,.6)}
.soll-lab{position:absolute;bottom:100%;transform:translateX(-50%);font-size:9px;color:var(--grau);
  white-space:nowrap;margin-bottom:4px;letter-spacing:.02em;pointer-events:none}
.hero .soll-lab{color:rgba(255,255,255,.55)}
.eingabe{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;
  border-bottom:2px solid var(--tinte);padding-bottom:12px;margin-bottom:16px}
.eingabe-z{font-size:50px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.045em;line-height:1}
.eingabe-e{font-size:20px;color:var(--grau);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--linie);background:var(--bg);border-radius:20px;padding:7px 13px;
  font-size:12.5px;color:var(--grau);cursor:pointer;font-family:inherit;font-weight:500}
.chip.on{background:var(--tinte);color:var(--auf-tinte);border-color:var(--tinte)}
.feld{width:100%;border:1px solid var(--linie);border-radius:11px;background:var(--bg);
  padding:12px;font-size:16px;font-family:inherit;color:var(--tinte);margin-bottom:16px}
.feld:focus{outline:none;border-color:var(--tinte)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.taste{background:var(--bg);border:1px solid var(--linie);border-radius:13px;padding:19px 0;
  font-size:23px;font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer;
  color:var(--tinte);font-family:inherit;transition:transform .08s,background .12s}
.taste:active{background:var(--tinte);color:var(--auf-tinte);transform:scale(.97)}
.vorschau{font-size:12.5px;color:var(--grau);text-align:right;margin-bottom:12px;font-weight:500}
.vorschau.rot{color:var(--rot)}
.primaer{width:100%;background:var(--tinte);color:var(--auf-tinte);border:none;border-radius:13px;
  padding:17px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.primaer:disabled{background:var(--linie);color:var(--grau)}
.sekundaer{width:100%;background:none;border:1.5px solid var(--tinte);border-radius:12px;
  color:var(--tinte);padding:13px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:inherit;margin-top:10px}
ul.liste{list-style:none;padding:0;margin:0}
.zeile{display:flex;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid var(--linie)}
.zeile:last-child{border-bottom:none}
.zeile-h{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.zeile-n{color:var(--grau);font-size:11.5px;margin-left:8px;font-weight:400}
.weg{background:none;border:none;color:#C9CDD4;font-size:19px;cursor:pointer;padding:0 2px}
.punkt{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grau);
  margin-right:8px;vertical-align:middle;flex:none}
.punkt[data-k=lebensmittel]{background:#0E9F6E}.punkt[data-k=auswaerts]{background:#E0473E}
.punkt[data-k=shopping]{background:#7C5CFF}.punkt[data-k=freizeit]{background:#F0A020}
.punkt[data-k=transport]{background:#2E7CF6}.punkt[data-k=geschenke]{background:#D946A6}
.reihe{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--linie);font-size:13.5px}
.reihe:last-child{border-bottom:none}
.reihe.stark{border-bottom:none;border-top:2px solid var(--tinte);font-weight:650;margin-top:4px}
.vert{margin-bottom:14px}
.vert-kopf{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:7px;font-weight:500}
.fz{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--linie)}
.fz:last-child{border-bottom:none}
.fd{width:42px;text-align:center;flex:none;background:var(--bg);border-radius:9px;padding:6px 0}
.ft{font-size:17px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.fm{font-size:10px;color:var(--grau);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.fi{flex:1;min-width:0}.fn{font-size:14px;font-weight:600}
.flab{font-size:9.5px;background:var(--tinte);color:var(--auf-tinte);border-radius:4px;padding:2px 5px;
  margin-left:7px;letter-spacing:.05em;text-transform:uppercase}
.flab.warn{background:var(--warn);color:#fff}
.medaillen{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.medaille{text-align:center;padding:15px 4px;border-radius:12px;background:var(--bg);
  color:var(--grau);opacity:.5}
.medaille.frei{color:var(--gruen);opacity:1}
.medaille-icon{margin-bottom:7px;display:flex;justify-content:center}
.medaille-icon svg{width:23px;height:23px}
.medaille-lab{font-size:9.5px;color:var(--grau);line-height:1.3;font-weight:600}
.medaille.frei .medaille-lab{color:var(--tinte)}
.finfo{font-size:11.5px;color:var(--grau);margin-top:2px;line-height:1.45}
.fw{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;white-space:nowrap}
.feldzeile{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:13px 0;border-bottom:1px solid var(--linie);font-size:14px}
.zahlfeld{width:92px;text-align:right;border:1px solid var(--linie);border-radius:10px;
  background:var(--bg);padding:9px;font-variant-numeric:tabular-nums;font-size:17px;
  font-weight:650;color:var(--tinte);font-family:inherit;flex:none}
.gross{font-size:44px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:6px 0}
textarea.feld{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--navbg);
  backdrop-filter:blur(12px);border-top:1px solid var(--linie);max-width:640px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:none;padding:15px 4px 17px;font-size:12px;
  color:var(--grau);cursor:pointer;font-family:inherit;font-weight:550}
nav button.on{color:var(--tinte);box-shadow:inset 0 2px 0 var(--tinte)}
.ok{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--tinte);
  color:var(--auf-tinte);padding:11px 20px;border-radius:22px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.ok.an{opacity:1}
</style>
</head>

const f2=n=>new Intl.NumberFormat("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const f0=n=>new Intl.NumberFormat("de-DE",{maximumFractionDigits:0}).format(n||0);
const tim=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
const mk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const wstart=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const tdiff=(a,b)=>Math.round((a-b)/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isoDatum=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const normalisiere=s=>(s||"").toLowerCase().trim().replace(/\s+/g," ");
const nameVon=f=>f.key?fl(f.key):f.name;
const wocheDesMonats=d=>{const erster=new Date(d.getFullYear(),d.getMonth(),1),off=(erster.getDay()+6)%7;return Math.ceil((d.getDate()+off)/7)};
const wochenImMonat=d=>wocheDesMonats(new Date(d.getFullYear(),d.getMonth()+1,0));
function wochenListe(d){
  const letzter=new Date(d.getFullYear(),d.getMonth()+1,0);
  const wochen=[];let start=wstart(new Date(d.getFullYear(),d.getMonth(),1));
  while(start<=letzter){
    const ende=new Date(start);ende.setDate(ende.getDate()+6);
    wochen.push({start:new Date(start),ende});
    start=new Date(start);start.setDate(start.getDate()+7);
  }
  return wochen;
}

function berechneErfolge(){
  const heute=new Date();
  let serieWochen=0,monatGruen=false;
  if(S.eintraege.length){
    const ersteTs=Math.min(...S.eintraege.map(e=>e.ts));
    const startWoche=wstart(new Date(ersteTs));
    const heuteStart=new Date(heute.getFullYear(),heute.getMonth(),heute.getDate());
    const alleWochen=wochenListe(heute).filter(w=>w.start>=startWoche&&w.ende<heuteStart);
    for(let i=alleWochen.length-1;i>=0;i--){
      const w=alleWochen[i],von=w.start.getTime(),bis=w.ende.getTime()+86399999;
      const posten=S.eintraege.filter(e=>e.ts>=von&&e.ts<=bis);
      const leb=posten.filter(e=>e.kat==="lebensmittel").reduce((s,e)=>s+e.betrag,0);
      const aus=posten.filter(e=>e.kat==="auswaerts").reduce((s,e)=>s+e.betrag,0);
      if(leb<=S.budget.w_lebensmittel&&aus<=S.budget.w_auswaerts)serieWochen++;
      else break;
    }
    const monate=[...new Set(S.eintraege.map(e=>mk(new Date(e.ts))))].filter(m=>m<mk(heute));
    monatGruen=monate.some(m=>{
      const posten=S.eintraege.filter(e=>mk(new Date(e.ts))===m);
      const sum=k=>posten.filter(e=>e.kat===k).reduce((s,e)=>s+e.betrag,0);
      return sum("lebensmittel")<=S.budget.w_lebensmittel*4.35&&sum("auswaerts")<=S.budget.w_auswaerts*4.35&&
        sum("shopping")<=S.budget.m_shopping&&sum("freizeit")<=S.budget.m_freizeit;
    });
  }
  return{erster:S.eintraege.length>=1,serie2:serieWochen>=2,serie4:serieWochen>=4,
    monatgruen:monatGruen,rueckwirkend:!!S.marken.rueckwirkend,import:!!S.marken.import};
}

const AUTOKAT=[
 [/rewe|edeka|lidl|aldi|netto|kaufland|tegut|denns|basic ag|hofer/i,"lebensmittel"],
 [/dm-drogerie|dm drogerie markt|rossmann|müller|budni/i,"haushalt"],
 [/deutsche bahn|db vertrieb|mvv|vag |uber |free now|taxi|tankstelle|shell|aral|esso|dkv|deutschlandticket/i,"transport"],
 [/apotheke|arzt|zahnarzt|physio/i,"gesundheit"],
 [/restaurant|café|cafe |kaffee|bäckerei|baecker|imbiss|lieferando|mcdonald|burger king|kfc|pizza|döner|doener/i,"auswaerts"],
 [/zalando|amazon|h&m|hm de|zara|mediamarkt|saturn/i,"shopping"],
 [/kino|spotify|netflix|disney|fitness|crossfit|fit\/one/i,"freizeit"],
 [/geschenk/i,"geschenke"]];
function autoKategorie(text){
  const norm=normalisiere(text);
  if(norm&&S.gelernt[norm])return S.gelernt[norm];
  const t=(text||"").toLowerCase();
  for(const[re,kat]of AUTOKAT)if(re.test(t))return kat;
  return "sonstiges";
}
function istDuplikat(datum,betrag){
  const tagStart=new Date(datum.getFullYear(),datum.getMonth(),datum.getDate()).getTime(),tagEnd=tagStart+86399999;
  return S.eintraege.some(e=>e.ts>=tagStart&&e.ts<=tagEnd&&Math.abs(e.betrag-betrag)<0.01);
}
function erkenneAbos(){
  const gruppen={};
  S.eintraege.forEach(e=>{
    const key=normalisiere(e.notiz);
    if(!key)return;
    (gruppen[key]=gruppen[key]||[]).push(e);
  });
  const bekannt=new Set([...FIX.map(f=>normalisiere(fl(f.key))),...S.abos.map(a=>normalisiere(a.name))]);
  const vorschlaege=[];
  Object.entries(gruppen).forEach(([key,posten])=>{
    if(posten.length<3||bekannt.has(key))return;
    const betraege=posten.map(e=>e.betrag).sort((a,b)=>a-b);
    const median=betraege[Math.floor(betraege.length/2)];
    if(betraege[betraege.length-1]-betraege[0]>median*0.2+2)return;
    const monate=new Set(posten.map(e=>mk(new Date(e.ts))));
    if(monate.size<3)return;
    const tage=posten.map(e=>new Date(e.ts).getDate()).sort((a,b)=>a-b);
    vorschlaege.push({id:"vs_"+key,name:posten[0].notiz.trim(),betrag:Math.round(median*100)/100,tag:tage[Math.floor(tage.length/2)],anzahl:posten.length});
  });
  return vorschlaege;
}
function parseCSV(text){
  const zeilen=text.split(/\r?\n/).map(z=>z.trim()).filter(z=>z.length);
  if(!zeilen.length)return{header:[],rows:[]};
  const delim=(zeilen[0].match(/;/g)||[]).length>=(zeilen[0].match(/,/g)||[]).length?";":",";
  const teilen=z=>z.split(delim).map(c=>c.replace(/^"|"$/g,"").trim());
  const header=teilen(zeilen[0]).map(h=>h.toLowerCase());
  return{header,rows:zeilen.slice(1).map(teilen)};
}
function findSpalte(header,kandidaten){
  for(const k of kandidaten){const i=header.findIndex(h=>h.includes(k));if(i>=0)return i}
  return -1;
}
function parseBetragDE(s){
  if(!s)return NaN;
  let t=s.replace(/[^\d,.\-]/g,"");
  if(t.includes(",")&&t.includes("."))t=t.replace(/\./g,"").replace(",",".");
  else if(t.includes(","))t=t.replace(",",".");
  return parseFloat(t);
}
function parseDatumDE(s){
  if(!s)return null;
  const m=s.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);
  if(m){let[,t,mo,j]=m;if(j.length===2)j="20"+j;return new Date(+j,+mo-1,+t,12,0,0)}
  const iso=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso){const[,j,mo,t]=iso;return new Date(+j,+mo-1,+t,12,0,0)}
  return null;
}
function csvEinlesen(){
  const{header,rows}=parseCSV(importText);
  if(!rows.length){toast(L("tKeineZeilen"));return}
  const iDatum=findSpalte(header,["buchungstag","valuta","datum"]);
  const iBetrag=findSpalte(header,["betrag","umsatz"]);
  const iText=findSpalte(header,["verwendungszweck","buchungstext","empfänger","empfaenger","begünstigter","zahlungsempf","name"]);
  if(iDatum<0||iBetrag<0){toast(L("tSpalteNichtErkannt"));return}
  const geparst=rows.map(r=>({datum:parseDatumDE(r[iDatum]),betrag:parseBetragDE(r[iBetrag]),text:iText>=0?r[iText]:""}))
    .filter(r=>r.datum&&!isNaN(r.betrag)&&r.betrag<0);
  if(!geparst.length){toast(L("tKeineAusgaben"));return}
  importRows=geparst.map((r,i)=>{
    const dup=istDuplikat(r.datum,Math.abs(r.betrag));
    return{id:"imp"+i,datum:r.datum,betrag:Math.abs(r.betrag),notiz:(r.text||"").slice(0,60),kat:autoKategorie(r.text),drin:!dup,dup};
  });
  render();
}

function naechste(f,h){
  const j=h.getFullYear(),k=[];
  if(f.typ==="monat"){for(let i=0;i<4;i++){const m=h.getMonth()+i;k.push(new Date(j,m,Math.min(f.tag,tim(new Date(j,m,1)))))}}
  else{f.monate.forEach(m=>[0,1].forEach(o=>k.push(new Date(j+o,m-1,Math.min(f.tag,tim(new Date(j+o,m-1,1)))))))}
  const h0=new Date(h.getFullYear(),h.getMonth(),h.getDate());
  return k.filter(d=>d>=h0).filter(d=>(!f.ab||d>=new Date(f.ab))&&(!f.bis||d<=new Date(f.bis))).sort((a,b)=>a-b)[0]||null;
}

  const tag=now.getDate(),tage=tim(now),wtag=((now.getDay()+6)%7)+1;
  const wom=wocheDesMonats(now),womT=wochenImMonat(now);
  const toepfe=[
   {id:"w_lebensmittel",label:kl("lebensmittel"),zykZeile:L("zykWoche")(wom,womT),ist:s(inW,"lebensmittel"),budget:S.budget.w_lebensmittel,pos:wtag,von:7},
   {id:"w_auswaerts",label:kl("auswaerts"),zykZeile:L("zykWoche")(wom,womT),ist:s(inW,"auswaerts"),budget:S.budget.w_auswaerts,pos:wtag,von:7},
   {id:"m_shopping",label:kl("shopping"),zykZeile:L("zykMonat")(MONL[lang][now.getMonth()],tag,tage),ist:s(inM,"shopping"),budget:S.budget.m_shopping,pos:tag,von:tage},
   {id:"m_freizeit",label:kl("freizeit"),zykZeile:L("zykMonat")(MONL[lang][now.getMonth()],tag,tage),ist:s(inM,"freizeit"),budget:S.budget.m_freizeit,pos:tag,von:tage}];
  const h0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const faellig=[...[...FIX,...S.abos].map(f=>({...f,wann:naechste(f,now)})).filter(f=>f.wann),
    ...EINMAL.map(e=>({...e,wann:new Date(e.datum),einmalig:1})).filter(e=>e.wann>=h0)].sort((a,b)=>a.wann-b.wann);
  return{tag,tage,wtag,wom,womT,toepfe,faellig,bald:faellig.filter(f=>tdiff(f.wann,h0)<=7),h0,
    monatGesamt:s(inM),proKat:KAT.map(k=>({...k,summe:s(inM,k.id)})),anzahl:inM.length};
}

function topfHTML(t){
  const rest=t.budget-t.ist,soll=t.budget?(t.budget/t.von)*t.pos:0,ueber=rest<0,vor=soll-t.ist;
  const sollPos=Math.min(100,t.budget?soll/t.budget*100:0),sollLabPos=Math.min(94,Math.max(6,sollPos));
  const pct=t.budget?t.ist/t.budget*100:0,warn=!ueber&&pct>=80;
  const farbe=ueber?"var(--rot)":warn?"var(--warn)":"var(--gruen)";
  return`<div class="topf"><div class="topf-kopf"><span class="topf-lab">${t.label}</span>
   <span class="topf-zyk">${t.zykZeile}</span></div>
   <div class="topf-zahl">${f0(Math.abs(rest))}<span class="topf-eur">€ ${ueber?L("ueber"):L("frei")}</span></div>
   <div class="spur"><span class="soll-lab" style="left:${sollLabPos}%">${L("sollLabel")}</span>

   <div class="topf-fuss">${L("topfFuss")(t.ist,t.budget)} · ${vor>=0?L("vorsprung")(vor):L("zuSchnell")(-vor)}</div></div>`;
}

    return`<li class="zeile"><span class="punkt" data-k="${e.kat}"></span>
    <span class="zeile-h">${esc(e.notiz||(k?kl(k.id):L("ausgabe")))}<span class="zeile-n">${k?kl(k.id):""} · ${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.</span></span>
    <span class="wert">${f2(e.betrag)}</span><button class="weg" data-del="${e.id}">×</button></li>`}).join("")}</ul></div>`:""}`;
}

function faellig(z){
  const alleFix=[...FIX,...S.abos];
  const sm=alleFix.filter(f=>f.typ==="monat").reduce((s,f)=>s+f.betrag,0);
  return`<div class="karte dunkel"><div class="topf-lab">${L("festeAbgaenge")}</div>
   <div class="gross">${f0(sm)} €</div>
   <div class="topf-fuss">${L("ohneQuartal")}</div></div>
  <div class="karte"><h2>${L("deineAbos")}</h2>${alleFix.map(f=>`
   <div class="fz"><div class="fi"><div class="fn">${esc(nameVon(f))}${f.bis?`<span class="flab warn">${L("endetAm")(String(new Date(f.bis).getDate()).padStart(2,"0")+"."+String(new Date(f.bis).getMonth()+1).padStart(2,"0")+".")}</span>`:""}</div>
   <div class="finfo">${f.typ==="monat"?L("monatlich"):L("quartalsweise")}</div></div>
   <div class="fw">${f0(f.betrag)} €</div></div>`).join("")}</div>
  <div class="karte"><h2>${L("alsNaechstesFaellig")}</h2>${z.faellig.slice(0,14).map(f=>{
    const t=tdiff(f.wann,z.h0);
    return`<div class="fz"><div class="fd"><div class="ft">${String(f.wann.getDate()).padStart(2,"0")}</div>
    <div class="fm">${MONL[lang][f.wann.getMonth()].slice(0,3)}</div></div>
    <div class="fi"><div class="fn">${esc(nameVon(f))}${f.einmalig?`<span class="flab">${L("einmalig")}</span>`:""}</div>
    ${f.info?`<div class="finfo">${esc(f.info)}</div>`:""}
    <div class="finfo">${t===0?L("heute"):L("inTagen")(t)}</div></div>
    <div class="fw">${f0(f.betrag)} €</div></div>`}).join("")}</div>`;
}

function erfolge(){
  const zustand=berechneErfolge();
  return`<div class="karte"><h2>${L("deineErfolge")}</h2>
   <p class="text">${L("erfolgeText")}</p>
   <div class="medaillen">${MARKEN.map(m=>{
     const frei=zustand[m.id];
     return`<div class="medaille${frei?" frei":""}" title="${esc(L("marke_"+m.id+"_text"))}">
      <div class="medaille-icon">${m.svg}</div>
      <div class="medaille-lab">${L("marke_"+m.id+"_titel")}</div></div>`;
   }).join("")}</div></div>`;
}

function referenz(z){
  const heute=new Date();
  const rb=wochenListe(heute).map((w,i)=>{
    const von=w.start.getTime(),bis=w.ende.getTime()+86399999;
    const posten=S.eintraege.filter(e=>e.ts>=von&&e.ts<=bis);
    const summe=posten.reduce((s,e)=>s+e.betrag,0);
    return{...w,nr:i+1,summe,anzahl:posten.length,aktuell:heute>=w.start&&heute<=w.ende};
  });
  const vormonat=new Date(heute.getFullYear(),heute.getMonth()-1,1),vmKey=mk(vormonat);
  const vmSumme=id=>S.eintraege.filter(e=>e.kat===id&&mk(new Date(e.ts))===vmKey).reduce((s,e)=>s+e.betrag,0);
  return`<div class="karte"><h2>${L("deinSchnitt")}</h2>
   <p class="text">${L("schnittText")}</p>
   ${KAT.filter(k=>k.ref>0).map(k=>{const ist=z.proKat.find(x=>x.id===k.id).summe;
   return`<div class="vert"><div class="vert-kopf"><span><span class="punkt" data-k="${k.id}"></span>${kl(k.id)}</span>
   <span class="wert">${f0(ist)} / ${f0(k.ref)} €</span></div>
   <div class="spur"><div class="fuell" style="width:${Math.min(100,ist/k.ref*100)}%;background:var(--tinte)"></div></div></div>`}).join("")}</div>
  <div class="karte"><h2>${L("monatsvergleich")}</h2>
   <p class="text">${L("monatsvergleichText")}</p>
   ${KAT.filter(k=>k.ref>0).map(k=>{
     const jetzt=z.proKat.find(x=>x.id===k.id).summe,vorher=vmSumme(k.id),delta=jetzt-vorher;
     const pfeil=delta>0?"▲":delta<0?"▼":"–",farbe=delta>0?"var(--rot)":delta<0?"var(--gruen)":"var(--grau)";
     return`<div class="reihe"><span>${kl(k.id)}</span><span class="wert">${f0(jetzt)} € <span style="color:${farbe};font-weight:600">${pfeil} ${f0(Math.abs(delta))} €</span></span></div>`;
   }).join("")}</div>
  <div class="karte"><h2>${L("wochenrueckblick")(MONL[lang][heute.getMonth()])}</h2>
   <p class="text">${L("rueckblickText")}</p>
   ${rb.map(w=>`<div class="reihe${w.aktuell?" stark":""}"><span>${L("wocheLabel")} ${w.nr} · ${String(w.start.getDate()).padStart(2,"0")}.${String(w.start.getMonth()+1).padStart(2,"0")}.–${String(w.ende.getDate()).padStart(2,"0")}.${String(w.ende.getMonth()+1).padStart(2,"0")}.${w.aktuell?" · "+L("aktuell"):""}</span><span class="wert">${w.anzahl?f0(w.summe)+" €":"—"}</span></div>`).join("")}</div>`;
}

function einstellungen(){
  return`${erfolge()}
  <div class="karte"><h2>${L("darstellung")}</h2>
   <div class="chips">
    <button class="chip${theme==='light'?' on':''}" data-theme-set="light">${L("hell")}</button>
    <button class="chip${theme==='dark'?' on':''}" data-theme-set="dark">${L("dunkel")}</button>
   </div>
   <div class="chips" style="margin-bottom:0">
    <button class="chip${lang==='de'?' on':''}" data-lang-set="de">Deutsch</button>
    <button class="chip${lang==='en'?' on':''}" data-lang-set="en">English</button>
   </div></div>`;
}

function budgets(){
  const F=[["w_lebensmittel",L("lebensmittelWoche"),L("taeglich")],
   ["w_auswaerts",L("auswaertsWoche"),L("taeglich")],
   ["m_shopping",L("shoppingMonat"),L("inSchueben")],
   ["m_freizeit",L("freizeitMonat"),L("inSchueben")]];
  const b=S.budget;
  return`<div class="karte"><h2>${L("budgetsHeading")}</h2>
   ${F.map(([id,l,h])=>`<div class="feldzeile"><div><label for="${id}">${l}</label><div class="finfo">${h}</div></div>
   <input class="zahlfeld" id="${id}" inputmode="decimal" value="${b[id]}"></div>`).join("")}
   <p class="finfo" style="margin-top:14px;line-height:1.6">${L("budgetErklaerung")}</p></div>
  <div class="karte"><h2>${L("umgerechnet")}</h2>
   <div class="reihe"><span>${L("lebensmittelMonat")}</span><span class="wert">${f0(b.w_lebensmittel*4.35)} €</span></div>
   <div class="reihe"><span>${L("auswaertsMonat")}</span><span class="wert">${f0(b.w_auswaerts*4.35)} €</span></div>
   <div class="reihe stark"><span>${L("alleToepfe")}</span><span class="wert">${f0(b.w_lebensmittel*4.35+b.w_auswaerts*4.35+b.m_shopping+b.m_freizeit)} €</span></div></div>
  <div class="karte"><h2>${L("csvHeading")}</h2>
   <p class="text">${L("csvText")}</p>
   <label class="sekundaer" style="display:block;text-align:center;cursor:pointer;margin-top:0">${L("csvDateiWaehlen")}
    <input type="file" id="csvdatei" accept=".csv,text/csv,text/plain" style="display:none"></label>
   <p class="finfo" style="text-align:center;margin:10px 0">${L("oder")}</p>
   <textarea class="feld" id="csvfeld" placeholder="${L("csvPlaceholder")}">${esc(importText)}</textarea>
   <button class="sekundaer" id="csvEinlesen">${L("einlesen")}</button>
   <button class="sekundaer" id="aboErkennen">${L("wiederkehrendeErkennen")}</button></div>
  <div class="karte"><h2>${L("datenSichern")}</h2>
   <p class="text">${L("datenSichernText")}</p>
   <button class="sekundaer" id="export">${L("alsDateiExportieren")}</button>
   <button class="sekundaer" id="kopieren">${L("inZwischenablage")}</button>
   <textarea class="feld" id="impfeld" placeholder="${L("wiederherstellenPlaceholder")}" style="margin-top:14px"></textarea>
   <button class="sekundaer" id="import">${L("wiederherstellen")}</button>
   <button class="sekundaer" id="allesLoeschen" style="border-color:var(--rot);color:var(--rot);margin-top:18px">${L("allesLoeschen")}</button></div>`;
}

function importAnsicht(){
  const n=importRows.filter(r=>r.drin).length;
  return`<div class="karte"><h2>${L("importPruefen")}</h2>
   <p class="text">${L("importText")(importRows.length)}</p>
   <ul class="liste">${importRows.map(r=>`<li class="zeile">
    <input type="checkbox" data-imp-check="${r.id}"${r.drin?" checked":""} style="flex:none;width:18px;height:18px">
    <span class="zeile-h">${esc(r.notiz||"—")}${r.dup?`<span class="flab warn">${L("moeglichesDuplikat")}</span>`:""}<span class="zeile-n">${String(r.datum.getDate()).padStart(2,"0")}.${String(r.datum.getMonth()+1).padStart(2,"0")}.</span></span>
    <select data-imp-kat="${r.id}" style="border:1px solid var(--linie);border-radius:8px;padding:5px 6px;font-size:12px;background:var(--bg);color:var(--tinte);font-family:inherit;flex:none">
     ${KAT.map(k=>`<option value="${k.id}"${k.id===r.kat?" selected":""}>${kl(k.id)}</option>`).join("")}
    </select>
    <span class="wert">${f2(r.betrag)}</span></li>`).join("")}</ul>
   <button class="primaer" id="impBestaetigen" style="margin-top:14px"${n?"":" disabled"}>${L("importBestaetigen")(n)}</button>
   <button class="sekundaer" id="impAbbrechen">${L("abbrechen")}</button></div>`;
}

function aboVorschlaegeAnsicht(){
  const n=aboVorschlaege.filter(v=>v.drin).length;
  return`<div class="karte"><h2>${L("aboErkannt")}</h2>
   <p class="text">${L("aboErkanntText")(aboVorschlaege.length)}</p>
   <ul class="liste">${aboVorschlaege.map(v=>`<li class="zeile">
    <input type="checkbox" data-vs-check="${v.id}"${v.drin?" checked":""} style="flex:none;width:18px;height:18px">
    <span class="zeile-h">${esc(v.name)}<span class="zeile-n">${L("proMonatAm")(v.tag)} · ${v.anzahl}×</span></span>
    <span class="wert">${f0(v.betrag)} €</span></li>`).join("")}</ul>
   <button class="primaer" id="vsBestaetigen" style="margin-top:14px"${n?"":" disabled"}>${L("aboUebernehmen")(n)}</button>
   <button class="sekundaer" id="vsAbbrechen">${L("abbrechen")}</button></div>`;
}

/* ═══ Rendern ══════════════════════════════════════════════ */
function render(){
  document.documentElement.lang=lang;
  const app=document.getElementById("app");
  if(importRows){app.innerHTML=importAnsicht();document.getElementById("nav").innerHTML="";bindenImport();return}
  if(aboVorschlaege){app.innerHTML=aboVorschlaegeAnsicht();document.getElementById("nav").innerHTML="";bindenAboVorschlaege();return}
  const z=rechne();
  const bald=z.bald.length?`<div class="bald"><div class="bald-lab">${L("baldFaellig")}</div>
   ${z.bald.map(f=>{const t=tdiff(f.wann,z.h0);
   return`<div class="bald-z"><span>${esc(nameVon(f))}</span><span class="wert">${f0(f.betrag)} €<span class="bald-t">${t===0?L("heute"):L("inT")(t)}</span></span></div>`}).join("")}</div>`:"";
  const heute=new Date();
  app.innerHTML=`<div class="kopf"><div>
   <div class="marke-zeile"><span class="marke">Angélique</span>
    <button class="iconbtn" id="themeToggle" aria-label="${L("zuThemaWechseln")}">${theme==="dark"?"☀":"☾"}</button>
    <button class="iconbtn" id="settingsBtn" aria-label="${settingsOffen?L("einstellungenSchliessen"):L("einstellungenOeffnen")}">${settingsOffen?"✕":"⚙"}</button>
   </div>
   <div class="datum">${WOT[lang][heute.getDay()]}, ${L("datumFormat")(heute.getDate(),MONL[lang][heute.getMonth()])}</div></div>
   <div class="badge">${L("badgeWoche")(z.wom,z.womT)}</div></div>${bald}
   ${settingsOffen?einstellungen():(tab==="erfassen"?erfassen(z):tab==="faellig"?faellig(z):tab==="referenz"?referenz(z):budgets())}`;
  document.getElementById("nav").innerHTML=[["erfassen",L("navErfassen")],["faellig",L("navFaellig")],["referenz",L("navReferenz")],["budgets",L("navBudgets")]]
   .map(([id,l])=>`<button class="${tab===id?"on":""}" data-tab="${id}">${l}</button>`).join("");
  binden();
}

function binden(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;settingsOffen=false;render()});
  const tt=document.getElementById("themeToggle");
  if(tt)tt.onclick=()=>{theme=theme==="dark"?"light":"dark";localStorage.setItem("kontur:theme",theme);themeAnwenden();render()};
  const sb=document.getElementById("settingsBtn");
  if(sb)sb.onclick=()=>{settingsOffen=!settingsOffen;render()};
  document.querySelectorAll("[data-kat]").forEach(b=>b.onclick=()=>{kat=b.dataset.kat;render()});
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;
    if(t==="back")wert=wert.slice(0,-1);
    else if(t===","){if(!wert.includes(",")&&wert!=="")wert+=","}
    else{const d=wert.split(",")[1];if(!(d!==undefined&&d.length>=2)&&wert.replace(",","").length<6)wert+=t}
    render()});
  const n=document.getElementById("notiz");
  if(n)n.oninput=e=>{notiz=e.target.value};
  const da=document.getElementById("datum");
  if(da)da.onchange=e=>{datum=e.target.value||isoDatum(new Date())};
  const bu=document.getElementById("buchen");
  if(bu)bu.onclick=()=>{
    const b=parseFloat(wert.replace(",","."))||0;if(b<=0)return;
    const[jj,mm,tt]=datum.split("-").map(Number),ts=new Date(jj,mm-1,tt,12,0,0).getTime();
    if(datum!==isoDatum(new Date()))S.marken.rueckwirkend=true;
    if(notiz.trim())S.gelernt[normalisiere(notiz)]=kat;
    S.eintraege.push({id:Date.now().toString(36),ts,betrag:b,kat,notiz:notiz.trim()});
    S.eintraege.sort((x,y)=>y.ts-x.ts);
    sichern();wert="";notiz="";datum=isoDatum(new Date());render();toast(L("tGebucht"))};
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    S.eintraege=S.eintraege.filter(e=>e.id!==b.dataset.del);sichern();render()});
  ["w_lebensmittel","w_auswaerts","m_shopping","m_freizeit"].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.onchange=e=>{S.budget[id]=Math.max(0,parseFloat(e.target.value.replace(",","."))||0);sichern();render()}});
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>{
    theme=b.dataset.themeSet;localStorage.setItem("kontur:theme",theme);themeAnwenden();render()});
  document.querySelectorAll("[data-lang-set]").forEach(b=>b.onclick=()=>{
    lang=b.dataset.langSet;localStorage.setItem("kontur:lang",lang);render()});
  const ex=document.getElementById("export");
  if(ex)ex.onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="angelique-"+new Date().toISOString().slice(0,10)+".json";a.click();toast(L("tExportiert"))};
  const kp=document.getElementById("kopieren");
  if(kp)kp.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toast(L("tKopiert"))}catch(e){toast(L("tGingNicht"))}};
  const im=document.getElementById("import");
  if(im)im.onclick=()=>{
    try{const d=JSON.parse(document.getElementById("impfeld").value);
      if(!d.eintraege)throw 0;
      S={eintraege:d.eintraege,budget:{...STD,...(d.budget||{})},marken:d.marken||{},abos:d.abos||[],gelernt:d.gelernt||{}};sichern();render();toast(L("tWiederhergestellt"))}
    catch(e){toast(L("tTextNichtLesbar"))}};
  const cf=document.getElementById("csvfeld");
  if(cf)cf.oninput=e=>{importText=e.target.value};
  const ce=document.getElementById("csvEinlesen");
  if(ce)ce.onclick=()=>csvEinlesen();
  const cd=document.getElementById("csvdatei");
  if(cd)cd.onchange=e=>{
    const datei=e.target.files[0];if(!datei)return;
    const reader=new FileReader();
    reader.onload=ev=>{importText=String(ev.target.result||"");csvEinlesen()};
    reader.onerror=()=>toast(L("tDateiNichtLesbar"));
    reader.readAsText(datei,"UTF-8")};
  const ae=document.getElementById("aboErkennen");
  if(ae)ae.onclick=()=>{
    const v=erkenneAbos();
    if(v.length){aboVorschlaege=v.map(x=>({...x,drin:true}));render()}
    else toast(L("tKeineAbosErkannt"))};
  const al=document.getElementById("allesLoeschen");
  if(al)al.onclick=()=>{
    if(confirm(L("allesLoeschenConfirm"))){S.eintraege=[];S.marken={};sichern();render();toast(L("tAllesGeloescht"))}};
}

function bindenImport(){
  document.querySelectorAll("[data-imp-check]").forEach(c=>c.onchange=e=>{
    const r=importRows.find(x=>x.id===c.dataset.impCheck);r.drin=e.target.checked;render()});
  document.querySelectorAll("[data-imp-kat]").forEach(s=>s.onchange=e=>{
    const r=importRows.find(x=>x.id===s.dataset.impKat);r.kat=e.target.value});
  const ok=document.getElementById("impBestaetigen");
  if(ok)ok.onclick=()=>{
    const neue=importRows.filter(r=>r.drin).map(r=>({id:"imp"+Date.now()+Math.random().toString(36).slice(2,6),ts:r.datum.getTime(),betrag:r.betrag,kat:r.kat,notiz:r.notiz}));
    if(neue.length)S.marken.import=true;
    neue.forEach(r=>{if(r.notiz)S.gelernt[normalisiere(r.notiz)]=r.kat});
    S.eintraege=S.eintraege.concat(neue).sort((a,b)=>b.ts-a.ts);
    sichern();const n=neue.length;importRows=null;importText="";
    const vorschlaege=erkenneAbos();
    if(vorschlaege.length){aboVorschlaege=vorschlaege.map(v=>({...v,drin:true}))}
    else tab="referenz";
    render();toast(L("tImportiert")(n))};
  const ab=document.getElementById("impAbbrechen");
  if(ab)ab.onclick=()=>{importRows=null;render()};
}

function bindenAboVorschlaege(){
  document.querySelectorAll("[data-vs-check]").forEach(c=>c.onchange=e=>{
    const v=aboVorschlaege.find(x=>x.id===c.dataset.vsCheck);v.drin=e.target.checked;render()});
  const ok=document.getElementById("vsBestaetigen");
  if(ok)ok.onclick=()=>{
    const neu=aboVorschlaege.filter(v=>v.drin).map(v=>({id:"abo"+Date.now()+Math.random().toString(36).slice(2,5),name:v.name,betrag:v.betrag,typ:"monat",tag:v.tag}));
    S.abos=S.abos.concat(neu);sichern();
    const n=neu.length;aboVorschlaege=null;tab="faellig";render();toast(L("tAboUebernommen")(n))};
  const ab=document.getElementById("vsAbbrechen");
  if(ab)ab.onclick=()=>{aboVorschlaege=null;tab="referenz";render()};
}

themeAnwenden();
laden();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
